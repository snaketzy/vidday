# Vidday 站点：静态前端（Vite 产物）+ /api 反代到本机 Fastify。
#
# 该文件是模板，__DOMAIN__ 由 deploy/setup.sh 用真实域名替换后
# 落到 /etc/nginx/sites-available/vidday；手工部署时自行替换即可。
#
# 证书使用 Cloudflare Origin Certificate（Dashboard → SSL/TLS → Origin Server），
# 并将 Cloudflare 的 SSL/TLS 加密模式设为 Full (strict)。
# 因此这里只放源站证书，不做 ACME 校验。

server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__;

  # 证书与 DNS 都在 Cloudflare 侧，源站一律转 HTTPS
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  # nginx ≥ 1.25.1 请改用下面两行替代上面的 http2 写法（旧写法会告警）：
  #   listen 443 ssl;
  #   http2 on;

  server_name __DOMAIN__;

  ssl_certificate     /etc/ssl/vidday/origin.pem;
  ssl_certificate_key /etc/ssl/vidday/origin.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  root /srv/vidday/web;
  index index.html;

  # Vite 产物带内容 hash，可长期强缓存；index.html 必须每次回源校验
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # SPA 路由回退：/watch/123、/person/8 等直接访问或刷新时必须回到 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 后端接口，同源反代：前端 VITE_API_BASE_URL 留空即可，天然无跨域
  location /api/ {
    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location = /health {
    proxy_pass http://127.0.0.1:8791;
    proxy_set_header Host $host;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
