appId: com.vidday.desktop
productName: Vidday

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - electron/dist/**
  - package.json
  # 后台服务（server/）只跑在服务端，绝不进入桌面包：
  # 白名单本身已排除它，这里再显式否掉一遍，防止日后加通配时把服务端代码与凭证打进安装包。
  - '!server/**'
  - '!**/.env'
  - '!**/.env.*'
  - '!**/*.ts'

# 打包期翻转 Electron fuses：写入 Electron 二进制、由代码签名保护，运行期无法回改。
# 仅在正式包生效，开发用的 node_modules/electron 二进制不受影响。
electronFuses:
  # 封堵 ELECTRON_RUN_AS_NODE=1 把应用二进制当纯 Node 解释器运行
  runAsNode: false
  # 丢弃 --inspect / --inspect-brk 等主进程调试开关，并禁用 SIGUSR1 打开 inspector
  enableNodeCliInspectArguments: false
  # 丢弃 NODE_OPTIONS / NODE_EXTRA_CA_CERTS，堵住 NODE_OPTIONS=--inspect 这条等价路径
  enableNodeOptionsEnvironmentVariable: false

# 内置代理内核与定制线路随包分发到 Contents/Resources/
extraResources:
  - from: resources
    to: .
    filter:
      - '**/*'
      - '!**/.gitkeep'

mac:
  category: public.app-category.entertainment
  target:
    - target: dmg
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  title: ${productName}
